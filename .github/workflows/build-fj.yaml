name: Build Forgejo CLI for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install forgejo-cli --root ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: fj-arm64-linux
          path: dist/bin/fj
          overwrite: true
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bin/fj